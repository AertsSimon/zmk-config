# Uncomment to enable encoder
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Lily58 OLED Display
# CONFIG_ZMK_DISPLAY=y

# By default only the central half (the one paired to your computer) reports
# its battery level over Bluetooth -- the peripheral half stays silent, so
# your OS shows one battery percentage and you have no visibility into the
# other half. This proxies the peripheral's battery reading through the
# central half so both show up (e.g. in macOS's Bluetooth battery widget).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
